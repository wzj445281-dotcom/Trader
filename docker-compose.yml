services:
  # 1. 数据库服务
  mysql:
    image: mysql:8.0
    container_name: trader_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "000000"
      MYSQL_DATABASE: "trader"
      TZ: "Asia/Shanghai"
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./backend/sql_init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  #  redis服务
  redis:
    image: redis:7.0
    container_name: trader_redis
    ports:
      - "6379:6379"
    restart: always

  # 2. 后端服务
  backend:
    build: ./backend
    container_name: trader_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trader?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "000000"
      JWT_SECRET: "MySuperSecretKeyForDockerEnvChangeMe123456"
      APP_UPLOAD_DIR: "/app/uploads/"

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      #  依赖 Redis
      redis:
        condition: service_started
    restart: on-failure

  # 3. 前端服务
  frontend:
    build: ./frontend
    container_name: trader_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data: